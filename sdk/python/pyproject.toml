[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relaylink-sdk"
version = "0.1.0"
description = "RelayLink SDK data-plane client (Python standard library only)."
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["relaylink_sdk*"]
