name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Verify website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm --prefix website ci
      - run: node scripts/build-website.mjs
      - run: npm --prefix website test

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: dotnet
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Select stable .NET SDK
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --roll-forward disable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - name: Install frontend dependencies
        run: pnpm --dir src/RelayLink.AdminWeb install --frozen-lockfile
      - name: Install Agent frontend dependencies
        run: pnpm --dir src/RelayLink.AgentWeb install --frozen-lockfile
      - name: Check frontend types
        run: pnpm --dir src/RelayLink.AdminWeb typecheck
      - name: Test frontend
        run: pnpm --dir src/RelayLink.AdminWeb test
      - name: Check frontend formatting
        run: pnpm --dir src/RelayLink.AdminWeb format:check
      - name: Check Agent frontend
        run: pnpm --dir src/RelayLink.AgentWeb build && pnpm --dir src/RelayLink.AgentWeb format:check
      - name: Restore .NET projects
        run: dotnet restore RelayLink.slnx --configfile NuGet.Config
      - name: Run .NET unit tests
        run: dotnet test tests/RelayLink.UnitTests/RelayLink.UnitTests.csproj --configuration Release --no-restore -p:SkipAdminWebBuild=true
      - name: Run .NET integration tests (including peer TLS tests)
        run: dotnet test tests/RelayLink.IntegrationTests/RelayLink.IntegrationTests.csproj --configuration Release --no-restore -p:EnablePeerTlsTests=true -p:SkipAdminWebBuild=true

  verify-macos-agent:
    name: Verify macOS Agent (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            runtime_identifier: osx-x64
            architecture: x86_64
          - runner: macos-15
            runtime_identifier: osx-arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: dotnet
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Select stable .NET SDK
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --roll-forward disable
      - name: Restore native integration tests
        run: dotnet restore tests/RelayLink.IntegrationTests/RelayLink.IntegrationTests.csproj --configfile NuGet.Config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - name: Build Agent frontend
        run: |
          pnpm --dir src/RelayLink.AgentWeb install --frozen-lockfile
          pnpm --dir src/RelayLink.AgentWeb build
      - name: Run native integration tests (including peer TLS tests)
        run: dotnet test tests/RelayLink.IntegrationTests/RelayLink.IntegrationTests.csproj --configuration Release --no-restore -p:EnablePeerTlsTests=true -p:SkipAdminWebBuild=true
      - name: Verify native Agent and launchd lifecycle
        run: ./scripts/test-macos-agent.sh '${{ matrix.runtime_identifier }}' '${{ matrix.architecture }}'
