name: Download release artifacts
description: Retry release asset downloads once using a fresh staging directory
inputs:
  artifact-ids:
    description: Comma-separated IDs of the release artifacts
    required: true
  path:
    description: Destination directory, which must not already exist
    required: true
runs:
  using: composite
  steps:
    - name: Prepare download directories
      id: staging
      shell: bash
      run: |
        staging="$(mktemp -d -- "$RUNNER_TEMP/relaylink-download.XXXXXXXX")"
        printf 'path=%s\n' "$staging" >> "$GITHUB_OUTPUT"
    - name: Download release artifacts
      id: download
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.artifact-ids }}
        path: ${{ steps.staging.outputs.path }}/first
        merge-multiple: true
    - name: Retry release artifact download
      if: steps.download.outcome == 'failure'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.artifact-ids }}
        path: ${{ steps.staging.outputs.path }}/retry
        merge-multiple: true
    - name: Move downloaded assets into place
      shell: bash
      env:
        STAGING: ${{ steps.staging.outputs.path }}
        DESTINATION: ${{ inputs.path }}
        DOWNLOAD: ${{ steps.download.outcome == 'success' && 'first' || 'retry' }}
      run: |
        test ! -e "$DESTINATION" && test ! -L "$DESTINATION"
        mv -T -- "$STAGING/$DOWNLOAD" "$DESTINATION"
    - name: Remove staging directory
      if: always() && steps.staging.outcome == 'success'
      shell: bash
      env:
        STAGING: ${{ steps.staging.outputs.path }}
      run: |
        case "$STAGING" in
          "$RUNNER_TEMP"/relaylink-download.*) rm -rf -- "$STAGING" ;;
        esac
