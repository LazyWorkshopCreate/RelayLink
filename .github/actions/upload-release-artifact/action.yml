name: Upload release artifact
description: Upload release archives with one retry for a transient transfer failure
inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Release files to upload
    required: true
outputs:
  artifact-id:
    description: ID of the successfully uploaded artifact
    value: ${{ steps.upload.outputs.artifact-id || steps.retry.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      id: upload
      continue-on-error: true
      with:
        name: ${{ inputs.name }}-attempt-${{ github.run_attempt }}
        path: ${{ inputs.path }}
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
    - if: steps.upload.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      id: retry
      with:
        name: ${{ inputs.name }}-attempt-${{ github.run_attempt }}-retry
        path: ${{ inputs.path }}
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
